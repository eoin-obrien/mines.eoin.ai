name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fast gate: 100 property runs on every push. The nightly job turns this up.
  MINES_PROP_RUNS: '100'

jobs:
  verify:
    # Set the repo variable RUNNER_LABEL to `self-hosted` to move CI onto the
    # self-hosted runners; hosted runners are the fallback so a fresh clone works.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is missing `node:sqlite`, which pnpm 11 requires, so the
        # toolchain itself cannot run there. The library's own Node 20 support is
        # checked against the built artifact in `engine-compat` below.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + property tests
        run: pnpm test:coverage

      - name: Build packages and site
        run: pnpm build

      - name: Bundle size budget
        run: pnpm size

      - name: Upload test + coverage reports
        if: always() && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: reports-node-${{ matrix.node }}
          path: |
            coverage/
            reports/
          if-no-files-found: ignore
          retention-days: 14

  engine-compat:
    # `@eoin/minesweeper-core` declares `engines: node >= 20`. The dev toolchain
    # cannot run on Node 20, so the claim is checked the way a consumer would:
    # build on current Node, then import the published ESM entry on the oldest
    # supported runtime.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eoin/minesweeper-core build

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Import the built entry on Node 20
        run: node .github/scripts/smoke-core.mjs
